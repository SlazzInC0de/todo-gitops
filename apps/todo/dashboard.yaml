# Grafana dashboard as code. Grafana's sidecar (configured by OpenTofu with
# searchNamespace=ALL) loads every ConfigMap labelled grafana_dashboard="1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  todo-api-red.json: |
    {
      "uid": "todo-api-red",
      "title": "Todo API \u00b7 RED metrics",
      "tags": [
        "devops-lab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate by route (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(http_request_duration_seconds_count{namespace=\"todo\"}[1m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"todo\",status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_request_duration_seconds_count{namespace=\"todo\"}[1m])), 1e-9)",
              "legendFormat": "5xx share"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"todo\"}[1m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"todo\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
