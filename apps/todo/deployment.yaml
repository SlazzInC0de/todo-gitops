apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: todo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: todo-api    # Kustomize replaces this with ghcr.io/<user>/todo-api:<sha>
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: todo-config }
            - secretRef: { name: todo-db }
          startupProbe:      # give the DB connection retry loop time on first start
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:    # can it serve traffic? (checks the database)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:     # is the process alive? (never checks dependencies)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
